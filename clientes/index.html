<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clientes — painel do administrador · Cartas da Dama</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1f070e] text-rose-50 min-h-screen p-5">
<main class="max-w-4xl mx-auto">
  <nav class="mb-8 pb-5 border-b border-[#d9b45f]/20">
  <div class="flex flex-nowrap items-center gap-1.5 text-[13px] whitespace-nowrap overflow-x-auto pb-1 [scrollbar-width:none]">
    <a href="../" class="group shrink-0 inline-flex items-center gap-1.5 pl-1 pr-3 py-1 rounded-full bg-gradient-to-r from-[#531326] to-[#3a0d1a] border border-[#d9b45f]/40 text-[#ecd49a] font-semibold text-sm shadow-lg shadow-black/40 hover:border-[#d9b45f] hover:from-[#6e1a33] transition"><span class="w-6 h-6 rounded-full bg-[#d9b45f] text-[#1f070e] flex items-center justify-center group-hover:-translate-x-0.5 transition">←</span>Voltar</a>
    <a href="../pedidos/" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#d9b45f]/25 text-rose-100/80 hover:border-[#d9b45f]/70 hover:bg-[#d9b45f]/10 hover:text-[#ecd49a] transition"><span>🛍️</span>Pedidos</a>
    <a href="../precos/" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#d9b45f]/25 text-rose-100/80 hover:border-[#d9b45f]/70 hover:bg-[#d9b45f]/10 hover:text-[#ecd49a] transition"><span>💲</span>Preços</a>
    <span aria-current="page" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#d9b45f] text-[#1f070e] font-bold shadow-lg shadow-[#d9b45f]/20"><span>👥</span>Clientes</span>
    <a href="../depoimentos/" class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#d9b45f]/25 text-rose-100/80 hover:border-[#d9b45f]/70 hover:bg-[#d9b45f]/10 hover:text-[#ecd49a] transition"><span>📝</span>Depoimentos</a>
  </div>
  </nav>
  <h1 class="text-2xl font-bold text-[#d9b45f]">Clientes cadastrados</h1>
  <p id="gate" class="mt-6 text-rose-100/70">Verificando acesso…</p>

  <section id="panel" class="hidden">
    <p class="text-sm text-rose-100/60 mt-1">Escolha quem pode administrar o site. Administradores veem estes painéis e o botão de adicionar depoimento.</p>
    <div class="mt-5 flex flex-wrap items-center gap-4">
      <input id="search" placeholder="Buscar por nome ou e-mail" class="flex-1 min-w-[200px] rounded-lg bg-[#3a0d1a] border border-[#d9b45f]/30 px-3 py-2">
      <span id="count" class="text-sm text-rose-100/60"></span>
    </div>
    <p id="msg" class="mt-3 text-sm min-h-[1.25rem]"></p>
    <ul id="list" class="mt-2 space-y-3"></ul>
  </section>
</main>

<script type="module">
import { configured, onUser, listUsers, setRole, esc } from '../firebase.js';
const $ = id => document.getElementById(id);
let users = [], me = null;
const msg = (t, ok = true) => { $('msg').textContent = t; $('msg').className = 'mt-3 text-sm min-h-[1.25rem] ' + (ok ? 'text-emerald-400' : 'text-red-400'); };
const fmt = d => d?.toDate ? d.toDate().toLocaleDateString('pt-BR') : '—';

function render() {
  const q = $('search').value.trim().toLowerCase();
  const rows = users.filter(u => !q || (u.nome || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
  $('count').textContent = `${users.length} cadastrado(s) · ${users.filter(u => u.role === 'admin').length} admin(s)`;
  $('list').innerHTML = rows.length ? '' : '<li class="text-rose-100/50">Nenhum cliente encontrado.</li>';
  rows.forEach(u => {
    const admin = u.role === 'admin', self = u.uid === me;
    const li = document.createElement('li');
    li.className = 'flex flex-wrap items-center gap-4 bg-[#3a0d1a] border border-[#d9b45f]/20 rounded-xl p-3';
    li.innerHTML = `
      ${u.foto ? `<img src="${esc(u.foto)}" referrerpolicy="no-referrer" class="w-11 h-11 rounded-full object-cover">` : '<div class="w-11 h-11 rounded-full bg-[#6e1a33] flex items-center justify-center">🧙‍♀️</div>'}
      <div class="flex-1 min-w-[180px]">
        <p class="font-bold">${esc(u.nome || '(sem nome)')} ${self ? '<span class="text-xs text-rose-100/50">(você)</span>' : ''}</p>
        <p class="text-sm text-rose-100/60 break-all">${esc(u.email)}</p>
        <p class="text-xs text-rose-100/40">Cadastro: ${fmt(u.criadoEm)}</p>
      </div>
      <span class="text-xs px-3 py-1 rounded-full border ${admin ? 'border-[#d9b45f] text-[#d9b45f]' : 'border-rose-100/30 text-rose-100/60'}">${admin ? 'Administrador' : 'Cliente'}</span>
      <button data-uid="${esc(u.uid)}" data-role="${admin ? 'cliente' : 'admin'}" ${self ? 'disabled title="Você não pode alterar a própria permissão"' : ''}
        class="text-sm px-4 py-1.5 rounded-full ${self ? 'opacity-40 cursor-not-allowed border border-rose-100/30' : 'bg-[#d9b45f] text-[#1f070e] font-bold hover:bg-[#ecd49a]'}">${admin ? 'Remover admin' : 'Tornar admin'}</button>`;
    $('list').appendChild(li);
  });
}

onUser(async state => {
  if (!configured) { $('gate').textContent = 'O Firebase ainda não foi configurado (veja FIREBASE-SETUP.md).'; return; }
  if (!state) { $('gate').innerHTML = 'Você precisa entrar para acessar. <a class="text-[#d9b45f] underline" href="../">Ir para o site e clicar em 🧙‍♀️ Entrar</a>.'; return; }
  if (state.profile.role !== 'admin') { $('gate').textContent = 'Acesso restrito a administradores.'; return; }
  me = state.user.uid;
  try { users = await listUsers(); } catch (e) { $('gate').textContent = 'Erro ao carregar clientes: ' + e.message; return; }
  $('gate').classList.add('hidden'); $('panel').classList.remove('hidden'); render();
});

$('search').addEventListener('input', render);
$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-uid]'); if (!b || b.disabled) return;
  const u = users.find(x => x.uid === b.dataset.uid), role = b.dataset.role;
  if (!confirm(role === 'admin' ? `Tornar ${u.nome || u.email} administrador(a)?` : `Remover a permissão de administrador de ${u.nome || u.email}?`)) return;
  try { await setRole(u.uid, role); u.role = role; msg(role === 'admin' ? 'Novo administrador definido ✓' : 'Permissão removida ✓'); render(); }
  catch (err) { msg('Não foi possível alterar: ' + err.message, false); }
});
</script>
</body>
</html>
